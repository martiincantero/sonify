<body>

    <header>
      <nav class="navbar">
        <div class="logo">
          <a href="index.html"><img src="img/Sonify.png" alt="Logo Sonify" class="logo"></a>
        </div>
        <ul class="nav-menu">
          <li><a href="search.html">Canciones</a></li>

        </ul>

    </header>
  
    <main class="main-content">
      <article class="contact" data-page="contact">
  
        <!-- Sección del mapa -->
        
  
        <!-- Formulario de contacto -->
        <section class="contact-form">
          <h3 class="h3 form-title">Formulario de Contacto</h3>
  
          <form action="#" class="form" data-form>
            <div class="input-wrapper">
              <input type="text" name="fullname" class="form-input" placeholder="Nombre y Apellidos" required data-form-input>
              <input type="email" name="email" class="form-input" placeholder="Correo electrónico" required data-form-input>
            </div>
  
            <textarea name="message" class="form-input" placeholder="Tu mensaje" required data-form-input></textarea>
  
            <button class="form-btn" type="submit" disabled data-form-btn>
              <ion-icon name="paper-plane"></ion-icon>
              <span>Enviar Mensaje</span>
            </button>
          </form>
        </section>
      </article>
    </main>
    <section class="mapbox" data-mapbox>
      <figure>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d98647.07705413317!2d-0.517230338671449!3d39.40781410822366!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd604f4cf0efb06f%3A0xb4a351011f7f1d39!2sValencia!5e0!3m2!1ses!2ses!4v1730741661933!5m2!1ses!2ses" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </figure>
    </section>
  </body>
